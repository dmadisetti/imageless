[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["dmadisetti"]
license = "Apache-2.0"
repository = "https://github.com/dmadisetti/imageless"
# No `homepage` until imageless.run serves something. The domain is registered
# and delegated but publishes no address record, and crates.io renders whatever
# metadata a version was uploaded with, forever — a Homepage button that fails
# to resolve is not fixable in the next patch. `imageless.run/*` remains the
# annotation namespace either way; that is a name, not a URL. Restoring this is
# one line, and RELEASING.md says so.

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Exact-pinned in one place so the resolver daemon and the kubectl plugin can
# never drift onto different HTTP stacks (one rustls in the lock, no openssl).
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "s"
lto = true
