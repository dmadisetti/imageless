[package]
name = "imageless-resolver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "imageless resolver daemon and unprivileged development evaluator"
# Deployed from the flake; the crates.io artifact is the library.
publish = false

[[bin]]
name = "imageless-resolver"
path = "src/resolver.rs"

[[bin]]
name = "imageless-dev-resolver"
path = "src/dev_resolver.rs"

[dependencies]
imageless = { path = "../imageless", features = ["daemon"] }
libc = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
oci-spec = "0.7"
