# All actions are pinned to full commit SHAs (tags are mutable; SHAs are not).
#   actions/checkout 11bd719...        == v4.2.2
#   cachix/install-nix-action 630ae54... == v31
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint + module eval + every package except the VM gates. A package that
  # does not build is a broken release, so packages ARE checks — and CI
  # builds the checks set itself (`nix flake check` builds every check
  # derivation) instead of a hand-maintained list a new package could
  # silently drift out of.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: flake metadata is locked
        run: nix flake metadata --no-update-lock-file
      - name: all checks build (lint, module eval, every package; workspace build runs cargo test)
        run: nix flake check -L
      # The rootless leg of the compatibility matrix (ROADMAP v0.2): the
      # store-projection shape must run under a completely stock runc with
      # no privileges — executed here, not just built, as the runner user.
      # Ubuntu's AppArmor restriction confines unprivileged user namespaces
      # (runc stage-1 gets EPERM unsharing the remaining namespaces); the
      # sysctl restores upstream kernel behavior so the smoke itself stays
      # unprivileged.
      - name: rootless stock-runc projection-shape smoke
        run: |
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          nix run -L .#stock-oci-smoke
      # Rung 2 of the push validation ladder (tests/push.rs is rung 1): the
      # hermetic stub encodes our reading of the distribution spec, and only
      # a real registry catches a misreading (upload sessions, server-side
      # digest verification). Loopback ⇒ plain HTTP with zero flags. The
      # second push must ride the HEAD-hit path; the pulls verify the stored
      # bytes are the ones the pod manifest pins, by tag and by digest.
      - name: kubectl-imageless push smoke against a real registry
        run: |
          set -o pipefail
          docker run -d -p 127.0.0.1:5000:5000 --name registry registry:2
          nix build -L .#kubectl-imageless
          export DOCKER_CONFIG="$(mktemp -d)"
          mkdir smoke-src && printf '{ outputs = _: { }; }\n' > smoke-src/flake.nix
          curl -fsS --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:5000/v2/
          for round in 1 2; do
            ./result/bin/kubectl-imageless run ./smoke-src \
              --repo 127.0.0.1:5000/team/smoke --tag smoke -- /bin/true \
              > pod.json 2> "push-$round.log"
            cat "push-$round.log"
          done
          # Round two must find both blobs already present, not re-upload them.
          test "$(grep -c 'already present' push-2.log)" = 2 || {
            echo "::error::re-push did not take the HEAD-hit path"; exit 1; }
          image=$(jq -r '.spec.containers[0].image' pod.json)
          digest="${image#*@}"
          for ref in "$digest" smoke; do
            curl -fsS -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              "http://127.0.0.1:5000/v2/team/smoke/manifests/$ref" > fetched.json
            got="sha256:$(sha256sum < fetched.json | cut -d' ' -f1)"
            test "$got" = "$digest" || {
              echo "::error::manifest by $ref is $got, not $digest"; exit 1; }
          done

  # The two acceptance gates are NixOS VM tests and need KVM. GitHub-hosted
  # Linux runners expose /dev/kvm; the guard below fails LOUDLY if that ever
  # stops being true — we do not silently skip the gates that define
  # conformance (SPEC.md §7).
  acceptance-gates:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: require KVM
        run: test -e /dev/kvm || { echo "::error::/dev/kvm missing — acceptance gates cannot run"; exit 1; }
      - name: docker embedded-layer gate (daemonless, in-process materializer)
        run: nix build -L .#docker-embedded-smoke
      - name: CRI lifecycle gate (resolver-daemon materializer, containerd 2.x)
        run: nix build -L .#imageless-cri-vm
      - name: CRI lifecycle gate (compatibility leg, containerd 1.x)
        run: nix build -L .#imageless-cri-vm-containerd1
